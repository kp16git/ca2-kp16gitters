<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoopVault — Login</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="./img/hoopvaultlogo.png">
</head>

<body data-page="login">
  <div class="container">
    <div class="auth-brand">
      <img class="auth-logo" src="./img/hoopvaultlogo.png" alt="HoopVault logo">
      <h1>HoopVault</h1>
    </div>
    <p class="subtitle">Sign in to your account</p>
    <div class="error" id="errorMsg"></div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>
    <button onclick="login()">Login</button>
    <div class="register-link">
      Don't have an account? <a href="./register.html">Register here</a>
    </div>
  </div>
  <script src="./js/main.js"></script>
</body>

</html>
